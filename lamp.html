
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Lampu On Off</title>
    <style>
        body { font-family: Arial; text-align:center; padding:40px; }
        img { width:200px; }
        button { padding:10px 20px; margin:10px; font-size:16px; }
    </style>
</head>
<body>
    <h2>Kontrol Lampu</h2>
    <img id="lamp" src="lamp_off.png" alt="lamp">
    <br>
    <button onclick="hidup()">Hidupkan</button>
    <button onclick="mati()">Matikan</button>

    <script>
        function hidup(){
            document.getElementById('lamp').src = 'lamp_on.png';
        }
        function mati(){
            document.getElementById('lamp').src = 'lamp_off.png';
        }
    </script>
</body>
</html>
